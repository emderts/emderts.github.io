<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingdoms Forlorn — Rogue's Path</title>
<style>
:root { --bg:#141210; --panel:#1e1a16; --panel2:#2a241d; --ink:#e4d8c4; --muted:#998b76; --gold:#c9a85a; --rose:#b2434a; --good:#6fae5c; --warn:#d9a441; --blue:#5b8dd6; --line:#3a3128; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 "Noto Sans KR", "Pretendard", system-ui, sans-serif; -webkit-text-size-adjust:100%; height:100%; }
h1 { font-family:Georgia, "Noto Serif KR", serif; letter-spacing:.06em; color:var(--gold); margin:0 0 4px; font-size:24px; }
h2 { font-size:16px; color:var(--gold); margin:14px 0 6px; }
.sub { color:var(--muted); margin:0 0 14px; }
.muted { color:var(--muted); } .small { font-size:12px; } .warn { color:var(--warn); } .err { color:var(--rose); } .good { color:var(--good); }
button { background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:9px 12px; cursor:pointer; font:inherit; min-height:42px; }
button:hover { border-color:var(--gold); }
button.primary { background:var(--gold); color:#1a1208; font-weight:700; border-color:var(--gold); }
button.sm { min-height:32px; padding:4px 9px; font-size:13px; }
button:disabled { opacity:.4; cursor:not-allowed; }
select, input { background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; max-width:100%; min-height:42px; }
#app { max-width:960px; margin:0 auto; padding:14px 12px calc(14px + env(safe-area-inset-bottom)); }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin:10px 0; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:8px; }
a { color:var(--gold); }
/* clash */
body.wide #app { max-width:1500px; padding:8px; }
.battle { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(340px,1fr); gap:10px; height:calc(100vh - 16px); }
.bleft, .bright { display:flex; flex-direction:column; gap:8px; min-height:0; }
.bhead { margin:0; }
#board { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:4px; flex:1 1 auto; min-height:0; display:flex; }
.bsvg { width:100%; height:100%; display:block; }
#mpane { flex:0 0 auto; max-height:32vh; overflow:auto; border-radius:10px; }
#kpane { flex:0 1 auto; max-height:38vh; overflow:auto; grid-template-columns:1fr 1fr; }
#lpane { flex:1 1 auto; min-height:120px; overflow:auto; border-radius:10px; }
.battle .sheet { position:static; max-height:45vh; border:1px solid var(--gold); border-radius:10px; box-shadow:none; padding:10px; flex:0 0 auto; }
.battle .sheet.idle { border-color:var(--line); padding:8px 10px; }
@media (max-width: 900px) {
  .battle { grid-template-columns:1fr; height:auto; }
  .bleft, .bright { display:contents; }
  .bhead { order:0; } #board { order:1; display:block; } .battle .sheet { order:2; max-height:none; } #kpane { order:3; max-height:none; } #mpane { order:4; max-height:none; } #lpane { order:5; max-height:45vh; }
  .bsvg { height:auto; max-height:52vh; }
  #kpane { grid-template-columns:1fr 1fr; }
}
@media (max-width: 520px) { #kpane { gap:4px; } #kpane .kbox { padding:6px; } .stat .sv { font-size:15px; } }
.cell { fill:#241e19; stroke:#3a3128; stroke-width:.6; }
.cell.alt { fill:#282119; }
.cell.front { fill:#2e2619; }
.cell.rear { fill:#1d2230; }
.cell.sel { fill:#3d5a3a; stroke:#8fd37f; stroke-width:1.5; cursor:pointer; } .cell.sel:hover { fill:#56805a; }
.ter { fill:#6b6a5a; stroke:#9a9680; stroke-width:.8; }
.mon { fill:#6b2a2a; stroke:#d05050; stroke-width:1.2; }
.kn { fill:#2b4d7a; stroke:#8ab4ff; stroke-width:1; pointer-events:none; }
.lbl, .ter, .mon { pointer-events:none; }
.kn.dead { fill:#333; stroke:#666; }
.kn.kd { stroke-dasharray:2 1.5; }
.lbl { font:bold 5px monospace; fill:#f0e6d2; text-anchor:middle; pointer-events:none; }
.coord { font:3.8px monospace; fill:#8a7d68; text-anchor:middle; }
.tabs { display:flex; gap:4px; }
.tabs button { flex:1; border-radius:8px 8px 0 0; }
.tabs button.on { background:var(--panel); border-bottom-color:var(--panel); color:var(--gold); font-weight:700; }
.pane { background:var(--panel); border:1px solid var(--line); border-radius:0 0 10px 10px; padding:10px; flex:1 1 auto; min-height:120px; overflow:auto; }
.log div { padding:2px 0; border-bottom:1px dashed var(--line); font-size:13px; }
.log .phase { color:var(--gold); font-weight:700; margin-top:6px; } .log .ai { color:#e0a0a0; } .log .dice { color:#b9c7e8; } .log .dmg, .log .death { color:var(--rose); } .log .wound { color:var(--good); } .log .mortis { color:var(--warn); } .log .warn { color:var(--warn); } .log .turn { color:#9ad; font-weight:600; } .log .atk { color:#cfc; } .log .pool { color:#aaa; } .log .cond { color:#e8c0ff; }
.kstat { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:6px; }
.kbox { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px; font-size:13px; }
.kbox.dead { opacity:.45; } .kbox.active { box-shadow:0 0 0 2px var(--gold) inset; }
.trisk { display:flex; gap:4px; margin:5px 0; }
.stat { flex:1; background:#1a1511; border-radius:6px; text-align:center; padding:2px 0; }
.stat .sn { font-size:9px; color:var(--muted); letter-spacing:.05em; } .stat .sv { font-size:17px; font-weight:700; line-height:1.15; } .stat .ss { font-size:10px; color:var(--warn); }
.stat.v .sv { color:var(--rose); } .stat.h .sv { color:var(--blue); } .stat.p .sv { color:var(--good); }
.kbox details summary { cursor:pointer; margin-top:3px; } .tag.cond { color:#e8c0ff; } .tag.warn { color:var(--warn); }
.track { display:flex; gap:2px; margin:3px 0; }
.track i { display:inline-block; width:10px; height:10px; border-radius:2px; background:#3a3128; }
.track.v i.on { background:var(--rose); } .track.h i.on { background:var(--blue); } .track.p i.on { background:var(--good); } .track i.lim { outline:1px solid #fff; }
.tag { display:inline-block; background:#3a3128; border-radius:4px; padding:1px 6px; font-size:12px; margin:1px; }
.sheet { position:fixed; left:0; right:0; bottom:0; background:#221c17; border-top:2px solid var(--gold); padding:12px 12px calc(12px + env(safe-area-inset-bottom)); max-height:55vh; overflow:auto; z-index:10; box-shadow:0 -6px 20px rgba(0,0,0,.5); }
.sheet .q { color:var(--gold); font-weight:600; margin-bottom:8px; }
.sheet .opts { display:flex; flex-wrap:wrap; gap:6px; }
.sheet .opts button { flex:1 1 auto; min-width:120px; }
.sheet .opts.num button { min-width:44px; flex:0 0 auto; }
.chip { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; background:#3a3128; margin:2px; }
.pvpath { fill:rgba(255,170,60,.18); stroke:rgba(255,170,60,.5); stroke-width:.5; pointer-events:none; } .pvend { fill:rgba(255,140,40,.32); stroke:#ff8c28; stroke-width:1; pointer-events:none; } .pvtxt { font:bold 4px monospace; fill:#ff8c28; text-anchor:middle; pointer-events:none; }
button.tog { border-style:dashed; } button.tog.on { background:#5a4a1a; border-color:var(--gold); border-style:solid; }
.link { cursor:pointer; } .link:hover { color:var(--gold); }
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:50; }
.modal { background:var(--panel); border:1px solid var(--gold); border-radius:12px; padding:16px; max-width:560px; width:92vw; max-height:85vh; overflow:auto; position:relative; }
.modal .close { position:absolute; top:8px; right:8px; } .modal h3 { color:var(--gold); margin:0 0 8px; font-size:15px; padding-right:40px; }
.cardview { background:#2b241d; border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:6px 0; font-size:13px; }
.cardview.ai { border-color:#a8503f; } .cardview.bp { border-color:#7a66b3; }
.cv-title { font-weight:700; color:var(--gold); margin-bottom:4px; } .cv-text { margin:3px 0; line-height:1.4; } .cv-gate { margin:4px 0; padding:3px 8px; background:#3a2a1a; border-left:3px solid var(--warn); border-radius:4px; }
.cards2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:4px 0; } .cards2 .cardview { margin:2px 0; font-size:12px; }
#flash { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:900; }
#flash .fcard { pointer-events:auto; cursor:pointer; background:rgba(20,17,15,.94); border:2px solid var(--gold); border-radius:14px; padding:14px 22px; min-width:240px; max-width:min(560px, 92vw); text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.6); animation: fpop .18s ease-out, fout .35s ease-in forwards; animation-delay:0s, var(--fdur, 1.5s); }
#flash .fcard.bad { border-color:var(--rose); } #flash .fcard.good { border-color:var(--good); } #flash .fcard.ai { border-color:#a8503f; } #flash .fcard.bp { border-color:#7a66b3; }
#flash .ft { color:var(--gold); font-weight:700; font-size:14px; margin-bottom:8px; } #flash .fs { color:var(--muted); font-size:13px; margin-top:8px; font-weight:600; }
#flash .fdice { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
#flash .die { width:44px; height:44px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:21px; background:#efe6d2; color:#1b1611; border:2px solid #cbb; animation: droll .32s ease-out; position:relative; }
#flash .die.hit { background:#ffd166; border-color:#f3b43a; } #flash .die.miss { background:#5a4f45; color:#cbb; border-color:#3a3128; } #flash .die.crit::after { content:'★'; position:absolute; top:-9px; right:-7px; font-size:12px; color:#ff9b86; }
#flash .pdie { min-width:46px; height:46px; padding:0 4px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:13px; border:2px solid #000; animation: droll .32s ease-out; }
#flash .pdie.r { background:#b8402f; color:#fff; } #flash .pdie.b { background:#111; color:#eee; border-color:#444; } #flash .pdie.w { background:#f2ead8; color:#1b1611; } #flash .pdie.m { background:#8a7f93; color:#fff; }
#flash .fname { font-size:19px; font-weight:800; margin:2px 0 6px; } #flash .ftext { font-size:13px; line-height:1.4; max-height:9em; overflow:hidden; }
@keyframes fpop { from { transform:scale(.85); opacity:0; } to { transform:scale(1); opacity:1; } }
@keyframes fout { to { transform:scale(1.03) translateY(-8px); opacity:0; } }
@keyframes droll { 0% { transform:rotate(-25deg) scale(.6); opacity:0; } 60% { transform:rotate(8deg) scale(1.08); opacity:1; } 100% { transform:none; } }
.kt { border-collapse:collapse; font-size:13px; width:100%; margin-top:6px; } .kt td { padding:3px 8px; border-bottom:1px solid var(--line); } .ktlv { color:var(--warn); font-weight:700; white-space:nowrap; } .kt tr.on td { background:#3a2f1a; } .kt tr.off td { opacity:.55; }
.kbtns { display:flex; gap:4px; margin:4px 0 2px; } button.kbtn { flex:1; padding:2px 4px; min-height:26px; font-size:11px; border-radius:6px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="flash"></div>
<script>window.KF_DATA = __DATA__;</script>
<script>__BUNDLE__</script>
</body>
</html>
